name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  deploy-staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: docker/setup-buildx-action@v3
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Authenticate Artifact Registry
        run: gcloud auth configure-docker "${{ vars.REGION }}-docker.pkg.dev" --quiet
      - name: Build and push immutable serving image
        env:
          IMAGE: ${{ vars.CONTAINER_REGISTRY }}/itcs355-serve:${{ github.event.workflow_run.head_sha }}
        run: docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t "$IMAGE" --push .
      - name: Deploy registered model to staging
        env:
          CLOUD_PROVIDER: gcp
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          BLOB_URI: ${{ vars.BLOB_URI }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
          IDENTITY_REF: ${{ vars.IDENTITY_REF }}
          MODEL_REF: ${{ vars.STAGING_MODEL_VERSION }}
          ENDPOINT_NAME: itcs355-staging
          INSTANCE: n1-standard-2
        run: |
          endpoint=$(python -c "from src import config; from cloudlayer.factory import get_adapter; c=config.load(); print(get_adapter(c).deploy('$MODEL_REF', '$ENDPOINT_NAME', '$INSTANCE'))")
          echo "ENDPOINT_RESOURCE=$endpoint" >> "$GITHUB_ENV"
      - name: Smoke test staging
        env:
          CLOUD_PROVIDER: gcp
          PROJECT_ID: ${{ vars.PROJECT_ID }}
          REGION: ${{ vars.REGION }}
          BLOB_URI: ${{ vars.BLOB_URI }}
          CONTAINER_REGISTRY: ${{ vars.CONTAINER_REGISTRY }}
          MLFLOW_TRACKING_URI: ${{ vars.MLFLOW_TRACKING_URI }}
          MODEL_REGISTRY_NAME: ${{ vars.MODEL_REGISTRY_NAME }}
          IDENTITY_REF: ${{ vars.IDENTITY_REF }}
        run: python scripts/smoke_test.py

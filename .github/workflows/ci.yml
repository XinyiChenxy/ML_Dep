name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Lint
        run: ruff check src/ service/ monitoring/ scripts/ tests/
      - name: Portability audit
        run: python scripts/portability_audit.py
      - name: Generate deterministic test data
        run: python scripts/make_dataset.py
      - name: Unit tests
        run: pytest -q tests/test_llm_eval.py tests/test_metrics.py tests/test_drift.py tests/test_lab2.py
      - name: Data contract tests
        run: pytest -q tests/test_data.py
      - name: Model behaviour tests
        run: pytest -q tests/test_model_behaviour.py
      - name: Service contract tests
        run: pytest -q tests/test_service.py

  image-integration:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: docker/setup-buildx-action@v3
      - name: Install locked dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Build SHA-tagged images
        run: |
          docker buildx build --platform linux/amd64 -t itcs355:${{ github.sha }} --load .
          docker buildx build --platform linux/amd64 -f service/Dockerfile.serve -t itcs355-serve:${{ github.sha }} --load .
      - name: Integration test the serving container
        run: |
          python scripts/make_dataset.py
          python scripts/export_model.py --out reports/model.joblib
          docker run -d --rm --name svc -p 8080:8080 \
            -v "$PWD/reports:/app/reports:ro" \
            -e MODEL_PATH=/app/reports/model.joblib \
            -e MODEL_VERSION=${{ github.sha }} \
            itcs355-serve:${{ github.sha }}
          trap 'docker stop svc >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 30); do
            curl -sf localhost:8080/ready && break
            sleep 2
          done
          response=$(curl -sf -X POST localhost:8080/predict \
            -H 'content-type: application/json' \
            -d '{"temp_c":78.4,"vibration_mm_s":3.1,"pressure_kpa":315.2,"hours_since_service":4200,"load_pct":68,"ambient_humidity":55}')
          python -c 'import json,sys; body=json.loads(sys.argv[1]); assert 0 <= body["probability"] <= 1; assert body["model_version"] == sys.argv[2]' "$response" "${{ github.sha }}"
          curl -sf localhost:8080/metrics | grep -q model_version_info

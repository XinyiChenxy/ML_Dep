# Lab 5 — pipeline as a neutral DAG.
#
# This file describes WHAT runs. cloudlayer/pipelines.py compiles it into SageMaker
# Pipelines, Azure ML Pipelines, or Vertex AI Pipelines. Keeping the DAG here rather than
# in provider SDK calls is what makes the pipeline portable, and it is why every step is
# a container rather than a function.

name: itcs355-training-pipeline
schedule: "CRON_TZ=Asia/Bangkok 0 2 * * 0"  # weekly; rationale and failure modes in README

steps:
  - name: ingest
    image: "${TRAINING_IMAGE_URI}"
    command: ["sh", "-c", "PIPELINE_UPLOAD=1 python scripts/make_dataset.py"]
    outputs: [raw_data]

  - name: validate
    image: "${TRAINING_IMAGE_URI}"
    command: ["sh", "-c", "python scripts/prepare_validation.py && pytest -q tests/test_data.py"]
    depends_on: [ingest]
    on_failure: abort
    # Aborting here is the point. A pipeline that trains on data failing its own contract
    # produces a model nobody should trust, and it will do so silently.

  - name: train
    image: "${TRAINING_IMAGE_URI}"
    command: ["python", "scripts/run_spot_training.py"]
    depends_on: [validate]
    instance: "${TRAIN_INSTANCE}"
    spot: true
    outputs: [model, metrics]

  - name: evaluate
    image: "${TRAINING_IMAGE_URI}"
    command: ["python", "scripts/evaluation_gate.py", "--metrics", "/tmp/metrics.json"]
    depends_on: [train]
    outputs: [gate_decision]

  - name: register
    image: "${TRAINING_IMAGE_URI}"
    command: ["python", "scripts/register.py"]
    depends_on: [evaluate]
    condition: "gate_decision == 'pass'"
    # The compiler maps this output condition to a real dsl.If branch.

  - name: deploy_staging
    image: "${TRAINING_IMAGE_URI}"
    command: ["python", "scripts/deploy.py", "--target", "staging"]
    depends_on: [register]

tags:
  course: itcs355
  student: "${PROJECT_ID}"
  lab: "5"

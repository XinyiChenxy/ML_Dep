# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze non-emergency deployments, page the service owner, and roll back to the
      last known-good model if 5xx errors or the current release consumed the budget.

  - name: latency
    target_p95_ms: 500
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Stop promotions, compare p99 and saturation by model version, then scale or roll
      back before resuming releases; do not hide the breach by relaxing the target.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Open a model-owner review within one business day; retrain only when data quality
      and drift checks pass, otherwise document why the existing model remains safer.
